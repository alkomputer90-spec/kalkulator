<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kalkulator</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#051826">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23051826'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='%232FA8D9' font-family='sans-serif'%3E÷%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#051826;
    --display-bg:#072438;
    --key-num:#0E3450;
    --key-num-active:#16466A;
    --key-fn:#154764;
    --key-fn-active:#1E5B80;
    --key-op:#2FA8D9;
    --key-op-active:#5CC0E8;
    --text-main:#EAF6FB;
    --text-dim:#5F92AC;
    --text-op-on-key:#04222E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    height:100%; margin:0;
    background:var(--bg);
    font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif;
    overscroll-behavior:none;
  }
  body{
    display:flex; flex-direction:column;
    height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .display{
    flex:1 1 auto;
    background:var(--display-bg);
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:24px 24px 8px;
    min-height:120px;
  }
  .history{
    color:var(--text-dim);
    font-size:16px;
    min-height:22px;
    text-align:right;
    letter-spacing:0.3px;
    overflow-x:auto;
    white-space:nowrap;
  }
  .current{
    color:var(--text-main);
    font-size:clamp(40px, 12vw, 64px);
    font-weight:500;
    text-align:right;
    line-height:1.15;
    word-break:break-all;
    font-variant-numeric:tabular-nums;
  }
  .keys{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-auto-rows:1fr;
    gap:1px;
    background:var(--bg);
    padding-bottom:8px;
  }
  button{
    border:none;
    outline:none;
    background:var(--key-num);
    color:var(--text-main);
    font-family:inherit;
    font-size:26px;
    font-weight:500;
    height:72px;
    display:flex; align-items:center; justify-content:center;
    transition:background 0.08s ease;
  }
  button:active{ background:var(--key-num-active); }
  .fn{ background:var(--key-fn); color:var(--text-main); font-size:22px;}
  .fn:active{ background:var(--key-fn-active); }
  .op{ background:transparent; color:var(--key-op); font-size:30px; font-weight:600; }
  .op:active{ background:rgba(232,163,61,0.12); }
  .op.active-op{ background:var(--key-op); color:var(--text-op-on-key); }
  .zero{ grid-column: span 2; justify-content:flex-start; padding-left:28px; }
  .equals{ background:var(--key-op); color:var(--text-op-on-key); }
  .equals:active{ background:var(--key-op-active); }
</style>
</head>
<body>

  <div class="display">
    <div class="history" id="history">&nbsp;</div>
    <div class="current" id="current">0</div>
  </div>

  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="negate">±</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-op="÷">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="×">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="−">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-action="decimal">,</button>
    <button class="equals" data-action="equals">=</button>
  </div>

<script>
(function(){
  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');

  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;

  function fmt(n){
    if (!isFinite(n)) return 'Error';
    let s = n.toString();
    if (s.length > 12) {
      s = parseFloat(n.toPrecision(10)).toString();
    }
    return s.replace('.', ',');
  }

  function render(){
    currentEl.textContent = current;
    if (operator && previous !== null){
      historyEl.textContent = previous.replace('.', ',') + ' ' + operator;
    } else if (justEvaluated && previous !== null){
      historyEl.textContent = previous.replace('.', ',') + ' ' + (operator||'');
    } else {
      historyEl.innerHTML = '&nbsp;';
    }
    document.querySelectorAll('.op').forEach(b=>{
      b.classList.toggle('active-op', operator && b.dataset.op === operator && !justEvaluated);
    });
  }

  function inputNum(d){
    if (justEvaluated){ current = '0'; previous=null; operator=null; justEvaluated=false; }
    if (current === '0') current = d;
    else if (current.replace('-','').replace('.','').length < 12) current += d;
    render();
  }

  function inputDecimal(){
    if (justEvaluated){ current = '0'; previous=null; operator=null; justEvaluated=false; }
    if (!current.includes('.')) current += '.';
    render();
  }

  function clearAll(){
    current = '0'; previous = null; operator = null; justEvaluated=false;
    render();
  }

  function negate(){
    if (current !== '0') current = current.startsWith('-') ? current.slice(1) : '-' + current;
    render();
  }

  function percent(){
    current = (parseFloat(current) / 100).toString();
    render();
  }

  function compute(a, b, op){
    a = parseFloat(a); b = parseFloat(b);
    switch(op){
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? Infinity : a / b;
    }
  }

  function chooseOperator(op){
    if (operator && previous !== null && !justEvaluated){
      const result = compute(previous, current, operator);
      previous = result.toString();
      current = fmt(result).replace(',', '.');
    } else {
      previous = current;
    }
    operator = op;
    justEvaluated = false;
    current = current; // keep showing previous number until next digit typed
    // reset current for next input but still show it as "previous" line
    currentEl.textContent = fmt(parseFloat(previous));
    render();
    current = previous; // will be overwritten by next inputNum's justEvaluated-less path
    startFresh = true;
  }

  let startFresh = false;
  function inputNumWrapped(d){
    if (startFresh){ current = '0'; startFresh = false; }
    inputNum(d);
  }
  function inputDecimalWrapped(){
    if (startFresh){ current = '0'; startFresh = false; }
    inputDecimal();
  }

  function equals(){
    if (operator && previous !== null){
      const result = compute(previous, current, operator);
      current = fmt(result).replace(',', '.');
      previous = previous; // keep for history display
      justEvaluated = true;
      startFresh = true;
    }
    render();
  }

  document.querySelectorAll('[data-num]').forEach(btn=>{
    btn.addEventListener('click', ()=> inputNumWrapped(btn.dataset.num));
  });
  document.querySelectorAll('[data-op]').forEach(btn=>{
    btn.addEventListener('click', ()=> chooseOperator(btn.dataset.op));
  });
  document.querySelector('[data-action="clear"]').addEventListener('click', clearAll);
  document.querySelector('[data-action="negate"]').addEventListener('click', negate);
  document.querySelector('[data-action="percent"]').addEventListener('click', percent);
  document.querySelector('[data-action="decimal"]').addEventListener('click', inputDecimalWrapped);
  document.querySelector('[data-action="equals"]').addEventListener('click', equals);

  window.addEventListener('keydown', (e)=>{
    if (e.key >= '0' && e.key <= '9') inputNumWrapped(e.key);
    else if (e.key === '.' || e.key === ',') inputDecimalWrapped();
    else if (e.key === '+') chooseOperator('+');
    else if (e.key === '-') chooseOperator('−');
    else if (e.key === '*') chooseOperator('×');
    else if (e.key === '/') { e.preventDefault(); chooseOperator('÷'); }
    else if (e.key === 'Enter' || e.key === '=') equals();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'Backspace') { current = current.length>1 ? current.slice(0,-1) : '0'; render(); }
  });

  render();
})();
</script>
</body>
</html>
